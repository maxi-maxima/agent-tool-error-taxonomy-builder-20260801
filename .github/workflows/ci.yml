name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile agent_tool_error_taxonomy_builder_20260801/__init__.py agent_tool_error_taxonomy_builder_20260801/cli.py tests/test_cli.py
      - run: python -m agent_tool_error_taxonomy_builder_20260801.cli tests/test_cli.py --format json
